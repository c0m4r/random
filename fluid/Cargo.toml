[package]
name = "fluid"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30.0"
winit = "0.30"
pollster = "1.0"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
glam = { version = "0.33", features = ["bytemuck"] }
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
